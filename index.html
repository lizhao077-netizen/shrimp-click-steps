const glint=document.getElementById('gutGlint');

function rect(){return stage.getBoundingClientRect();}
function pointOnPage(x,y){const r=rect(); return {x:r.left + x*r.width/1672, y:r.top + y*r.height/941};}
function floorAtX(pageX){
  const r=rect();
  const xImg=(pageX-r.left)/r.width*1672;
  if(xImg<=bottomProfile[0][0]) return r.top + bottomProfile[0][1]*r.height/941;
  for(let i=1;i<bottomProfile.length;i++){
    const [x2,y2]=bottomProfile[i], [x1,y1]=bottomProfile[i-1];
    if(xImg<=x2){ const t=(xImg-x1)/(x2-x1); return r.top + (y1+(y2-y1)*t)*r.height/941; }
  }
  return r.top + bottomProfile[bottomProfile.length-1][1]*r.height/941;
}
function slopeAtX(pageX){
  const r=rect();
  const xImg=(pageX-r.left)/r.width*1672;
  for(let i=1;i<bottomProfile.length;i++){
    const [x2,y2]=bottomProfile[i], [x1,y1]=bottomProfile[i-1];
    if(xImg<=x2) return (y2-y1)/(x2-x1);
  }
  const l=bottomProfile.length; const a=bottomProfile[l-2], b=bottomProfile[l-1];
  return (b[1]-a[1])/(b[0]-a[0]);
}
function resize(){
  w=window.innerWidth; h=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  for(const p of pieces){ if(p.sleep) p.y=Math.min(p.y, floorAtX(p.x)-p.radius); }
}
window.addEventListener('resize', resize); resize();
function updateGut(distance){
  const portion=Math.max(0,Math.min(gutLength,distance));
  for(const p of [gut,shadow,glint]){
    p.style.strokeDasharray=portion.toFixed(2)+' '+(gutLength+30).toFixed(2);
    p.style.strokeDashoffset='0';
  }
}
updateGut(0);
function getTailPagePoint(){
  const p = gut.getPointAtLength(gutLength);
  return pointOnPage(p.x,p.y);
}
function spawnPiece(){
  const r=rect();
  const tail=getTailPagePoint();
  const len=stepLength*r.width/1672;
  const thick=Math.max(4,11.5*r.width/1672);
  const radius=Math.max(thick*.72, len*.24);
  const jitter=(Math.random()-.5)*6;
  pieces.push({
    x:tail.x-2+jitter,
    y:tail.y+2,
    vx:-95 + (Math.random()-.5)*26,
    vy:20 + Math.random()*22,
    angle:-0.18 + (Math.random()-.5)*0.16,
    av:(Math.random()-.5)*2.0,
    length:len,
    thickness:thick,
    radius:radius,
    sleep:false,
    sleepFor:0
  });

}

  if(fillSteps < FILL_CLICKS){

    spawnPiece();
  }
}
function drawPiece(p){
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.angle);
  const left=-p.length*.5, right=p.length*.5;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='rgba(20,17,13,.18)'; ctx.lineWidth=p.thickness+3;
  ctx.beginPath(); ctx.moveTo(left,1.5); ctx.quadraticCurveTo(0,-1.5,right,1.1); ctx.stroke();
  const grad=ctx.createLinearGradient(0,-p.thickness,0,p.thickness);

  ctx.strokeStyle=grad; ctx.lineWidth=p.thickness;
  ctx.beginPath(); ctx.moveTo(left,0); ctx.quadraticCurveTo(0,-p.thickness*.16,right,0); ctx.stroke();
  ctx.strokeStyle='rgba(201,161,107,.42)'; ctx.lineWidth=Math.max(.8,p.thickness*.13);

function solveCollisions(){
  for(let k=0;k<2;k++){
    for(let i=0;i<pieces.length;i++){
      const a=pieces[i];
      for(let j=i+1;j<pieces.length;j++){
        const b=pieces[j];
        const dx=b.x-a.x, dy=b.y-a.y;
        const dist=Math.hypot(dx,dy)||0.0001;
        const minDist=a.radius+b.radius;
        if(dist<minDist){
          const overlap=minDist-dist;
          const nx=dx/dist, ny=dy/dist;
          const aMove=a.sleep?0:(b.sleep?1:0.5);
          const bMove=b.sleep?0:(a.sleep?1:0.5);
          a.x-=nx*overlap*aMove; a.y-=ny*overlap*aMove;
          b.x+=nx*overlap*bMove; b.y+=ny*overlap*bMove;

      p.av *= 0.78;
      if(Math.abs(p.vy)<SLEEP_V && Math.abs(p.vx)<SLEEP_V) p.sleepFor += dt; else p.sleepFor=0;
      if(p.sleepFor>.18){ p.sleep=true; p.vx=0; p.vy=0; p.av=0; }
    } else {
      p.sleepFor=0;
    }
    if(p.x < r.left+p.radius){ p.x=r.left+p.radius; p.vx=Math.abs(p.vx)*0.25; }
    if(p.x > r.right-p.radius){ p.x=r.right-p.radius; p.vx=-Math.abs(p.vx)*0.25; }
  }
}
function tick(now){
  const dt=Math.min((now-(last||now))/1000, .045); last=now;
  if(Math.abs(shownLength-targetLength)>.04){
    shownLength += (targetLength-shownLength)*Math.min(1, dt*11);
    if(Math.abs(shownLength-targetLength)<.1) shownLength=targetLength;
    updateGut(shownLength);
  }
  physics(dt);
  ctx.clearRect(0,0,w,h);
  for(const p of pieces) drawPiece(p);
  requestAnimationFrame(tick);
}
window.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse' && e.button!==0) return; click(); },{passive:true});
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); click(); } });
window.__shrimpDebug={get fillSteps(){return fillSteps;}, get pieces(){return pieces;}};
requestAnimationFrame(tick);
})();
</script>
